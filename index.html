<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שאלון בית חכם</title>
<style>
  :root {
    --accent: #1f3a5f;
    --accent-2: #f2c200;
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1d2430;
    --muted: #667085;
    --line: #dfe3ea;
    --danger: #c0392b;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 14px 60px; }
  header.top {
    background: var(--accent); color: #fff; border-radius: var(--radius);
    padding: 22px 22px 18px; position: relative;
  }
  header.top h1 { margin: 0 0 6px; font-size: 1.5rem; }
  header.top p { margin: 0; opacity: .9; }
  .langs { position: absolute; top: 14px; inset-inline-end: 14px; display: flex; gap: 6px; }
  .langs button {
    background: transparent; border: 1px solid rgba(255,255,255,.5); color: #fff;
    border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: .85rem;
  }
  .langs button.on { background: var(--accent-2); border-color: var(--accent-2); color: var(--accent); font-weight: 600; }
  header.top h1 { padding-inline-end: 150px; }
  @media (max-width: 560px) {
    .langs { position: static; margin-bottom: 12px; }
    header.top h1 { padding-inline-end: 0; }
  }

  section.card {
    background: var(--card); border-radius: var(--radius); padding: 18px 18px 20px;
    margin-top: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.06);
  }
  section.card h2 { margin: 0 0 4px; font-size: 1.1rem; color: var(--accent); }
  .hint { color: var(--muted); font-size: .9rem; margin: 0 0 14px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
  label.f { display: block; font-size: .88rem; color: var(--muted); margin-bottom: 4px; }
  .req::after { content: " *"; color: var(--danger); }
  input, select, textarea {
    width: 100%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: #fff; color: var(--text);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-2); border-color: var(--accent); }
  textarea { min-height: 80px; resize: vertical; }
  .invalid { border-color: var(--danger) !important; background: #fff6f5; }

  /* Equipment rows */
  .row {
    display: grid; gap: 10px; align-items: start;
    grid-template-columns: max-content minmax(0, 1fr) 70px minmax(110px, 140px) 36px;
    padding: 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px;
    background: #fbfcfe;
  }
  .row .type select { width: auto; min-width: 100%; padding-inline-end: 30px; }
  .row .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .row .opts > div { flex: 1 1 auto; }
  .row .opts select { width: auto; min-width: 100%; padding-inline-end: 30px; }
  .row .none { color: var(--muted); font-size: .85rem; padding-bottom: 10px; }
  .del {
    margin-top: 24px; width: 36px; height: 40px; border: none; background: transparent; color: var(--muted);
    font-size: 1.4rem; cursor: pointer; border-radius: 8px;
  }
  .del:hover { background: #fdecea; color: var(--danger); }
  @media (max-width: 1000px) {
    .row { grid-template-columns: 1fr 1fr; align-items: end; position: relative; padding-top: 16px; }
    .del { margin-top: 0; position: absolute; top: 2px; inset-inline-end: 4px; height: 32px; }
    .row .type { grid-column: 1 / -1; }
    .row .opts-cell { grid-column: 1 / -1; }
    .row .del { justify-self: end; }
  }
  .add {
    display: inline-flex; align-items: center; gap: 8px; border: 2px dashed var(--accent);
    background: transparent; color: var(--accent); font: inherit; font-weight: 600;
    padding: 10px 16px; border-radius: 10px; cursor: pointer;
  }
  .add span { font-size: 1.3rem; line-height: 1; }
  .add:hover { background: #eef3f9; }

  .actions { margin-top: 18px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .send {
    background: var(--accent-2); color: var(--accent); border: none; font: inherit; font-weight: 700;
    padding: 12px 26px; border-radius: 10px; cursor: pointer; font-size: 1.05rem;
  }
  .send[disabled] { opacity: .6; cursor: wait; }
  .err { color: var(--danger); font-size: .92rem; }
  .hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

  .thanks { text-align: center; padding: 40px 18px; }
  .thanks .ok {
    width: 64px; height: 64px; border-radius: 50%; background: var(--accent-2); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700;
  }
  .thanks h2 { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="he">עברית</button>
      <button type="button" data-lang="fr">Français</button>
      <button type="button" data-lang="en">English</button>
    </div>
    <h1 data-i="title"></h1>
    <p data-i="intro"></p>
  </header>

  <form id="f" novalidate>
    <section class="card">
      <h2 data-i="contactH"></h2>
      <p class="hint" data-i="contactHint"></p>
      <div class="grid2">
        <div><label class="f req" for="name" data-i="name"></label><input id="name" autocomplete="name"></div>
        <div><label class="f req" for="phone" data-i="phone"></label><input id="phone" type="tel" dir="ltr" autocomplete="tel"></div>
        <div><label class="f req" for="area" data-i="area"></label><input id="area"></div>
        <div><label class="f" for="email" data-i="email"></label><input id="email" type="email" dir="ltr" autocomplete="email"></div>
      </div>
      <div class="hp" aria-hidden="true"><input id="website" tabindex="-1" autocomplete="off"></div>
    </section>

    <section class="card">
      <h2 data-i="equipH"></h2>
      <p class="hint" data-i="equipHint"></p>
      <div id="rows"></div>
      <button type="button" class="add" id="addRow"><span>+</span><b data-i="add"></b></button>
    </section>

    <section class="card">
      <h2 data-i="moreH"></h2>
      <div class="grid2">
        <div><label class="f" for="wifi" data-i="wifi"></label><select id="wifi"></select></div>
        <div><label class="f" for="when" data-i="when"></label><select id="when"></select></div>
      </div>
      <div style="margin-top:12px"><label class="f" for="notes" data-i="notes"></label><textarea id="notes"></textarea></div>
      <div class="actions">
        <button type="submit" class="send" id="send" data-i="send"></button>
        <span class="err" id="err"></span>
      </div>
    </section>
  </form>

  <section class="card thanks" id="thanks" hidden>
    <div class="ok">✓</div>
    <h2 data-i="thanksH"></h2>
    <p data-i="thanksP"></p>
  </section>
</div>

    },

// Which options each equipment type shows.
var TYPE_OPTS = {
  switch: ['shape', 'color', 'buttons'],
  boiler: ['boilerMode'],
  ac: ['acMode'],
  plug: ['plugKind'],
  shutter: ['shutterKind'],
  breaker: ['breakerAmp'],
  camera: ['camStorage', 'camLens', 'camWhere'],
  sensor: ['sensorKind']
};
var TYPE_ORDER = ['switch', 'boiler', 'ac', 'plug', 'shutter', 'breaker', 'camera', 'sensor'];

var lang = 'he';
var rowsEl = document.getElementById('rows');

function t(k) { return I18N[lang][k]; }
function el(tag, attrs, kids) {
  var e = document.createElement(tag);
  for (var a in (attrs || {})) {
    if (a === 'text') e.textContent = attrs[a]; else e.setAttribute(a, attrs[a]);
  }
  (kids || []).forEach(function (k) { if (k) e.appendChild(k); });
  return e;
}
function fillSelect(sel, values, keepFirstEmpty) {
  var cur = sel.selectedIndex;
  sel.innerHTML = '';
  if (keepFirstEmpty) sel.appendChild(el('option', { value: '', text: '—' }));
  values.forEach(function (v, i) { sel.appendChild(el('option', { value: String(i), text: v })); });
  if (cur >= 0 && cur < sel.options.length) sel.selectedIndex = cur;
}

function buildOpts(row) {
  var type = row.querySelector('.type select').value;
  var box = row.querySelector('.opts');
  var prev = {};
  box.querySelectorAll('select').forEach(function (s) { prev[s.name] = s.value; });
  box.innerHTML = '';
  if (!type) return;
  var keys = TYPE_OPTS[type];
  if (!keys.length) { box.appendChild(el('div', { 'class': 'none', text: t('noOpt') })); return; }
  keys.forEach(function (k) {
    var def = t('opts')[k];
    var sel = el('select', { name: k });
    Object.keys(def[1]).forEach(function (v) { sel.appendChild(el('option', { value: v, text: def[1][v] })); });
    if (prev[k]) sel.value = prev[k];
    box.appendChild(el('div', {}, [el('label', { 'class': 'f', text: def[0] }), sel]));
  });
}

function addRow() {
  var typeSel = el('select', { 'class': 'tsel' });
  var row = el('div', { 'class': 'row' }, [
    el('div', { 'class': 'type' }, [el('label', { 'class': 'f lbl-type' }), typeSel]),
    el('div', { 'class': 'opts-cell' }, [el('div', { 'class': 'opts' })]),
    el('div', {}, [el('label', { 'class': 'f lbl-qty' }), el('input', { type: 'number', min: '1', value: '1', 'class': 'qty', inputmode: 'numeric' })]),
    el('div', {}, [el('label', { 'class': 'f lbl-room' }), el('input', { 'class': 'room' })]),
    el('button', { type: 'button', 'class': 'del', text: '×' })
  ]);
  typeSel.addEventListener('change', function () { typeSel.classList.remove('invalid'); buildOpts(row); });
  row.querySelector('.del').addEventListener('click', function () {
    row.remove();
    if (!rowsEl.children.length) addRow();
  });
  rowsEl.appendChild(row);
  labelRow(row);
  return row;
}

function labelRow(row) {
  var sel = row.querySelector('.tsel');
  var cur = sel.value;
  sel.innerHTML = '';
  sel.appendChild(el('option', { value: '', text: t('choose') }));
  TYPE_ORDER.forEach(function (k) { sel.appendChild(el('option', { value: k, text: t('types')[k] })); });
  sel.value = cur;
  row.querySelector('.lbl-type').textContent = t('type');
  row.querySelector('.lbl-qty').textContent = t('qty');
  row.querySelector('.lbl-room').textContent = t('room');
  row.querySelector('.room').placeholder = t('roomPh');
  row.querySelector('.del').title = t('remove');
  row.querySelector('.del').setAttribute('aria-label', t('remove'));
  buildOpts(row);
}

function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = I18N[l].dir;
  document.title = t('title');
  document.querySelectorAll('[data-i]').forEach(function (e) { e.textContent = t(e.getAttribute('data-i')); });
  document.querySelectorAll('.langs button').forEach(function (b) { b.classList.toggle('on', b.dataset.lang === l); });
  ['wifi', 'when'].forEach(function (k) { fillSelect(document.getElementById(k), t('lists')[k], true); });
  Array.prototype.forEach.call(rowsEl.children, labelRow);
  document.getElementById('err').textContent = '';
}

document.querySelectorAll('.langs button').forEach(function (b) {
  b.addEventListener('click', function () { setLang(b.dataset.lang); });
});
document.getElementById('addRow').addEventListener('click', function () {
  var r = addRow(); r.querySelector('.tsel').focus();
});

function textOf(sel) { return sel.value === '' ? '' : sel.options[sel.selectedIndex].text; }

function collect() {
  var items = [];
  Array.prototype.forEach.call(rowsEl.children, function (row) {
    var sel = row.querySelector('.tsel');
    if (!sel.value) return;
    var opts = [];
    row.querySelectorAll('.opts select').forEach(function (s) {
      opts.push(I18N[lang].opts[s.name][0] + ': ' + textOf(s));
    });
    items.push({
      type: I18N.fr.types[sel.value],
      typeLocal: textOf(sel),
      options: opts.join(' · '),
      optionsFr: Array.prototype.map.call(row.querySelectorAll('.opts select'), function (s) {
        return I18N.fr.opts[s.name][0] + ': ' + I18N.fr.opts[s.name][1][s.value];
      }).join(' · '),
      qty: Math.max(1, parseInt(row.querySelector('.qty').value, 10) || 1),
      room: row.querySelector('.room').value.trim()
    });
  });
  function v(id) { return document.getElementById(id).value.trim(); }
  return {
    lang: lang,
    name: v('name'), phone: v('phone'), area: v('area'), email: v('email'),
    wifi: textOf(document.getElementById('wifi')),
    when: textOf(document.getElementById('when')),
    notes: v('notes'),
    website: v('website'),
    items: items
  };
}

document.getElementById('f').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var err = document.getElementById('err');
  err.textContent = '';
  var ok = true;
  ['name', 'phone', 'area'].forEach(function (id) {
    var i = document.getElementById(id);
    var bad = !i.value.trim();
    i.classList.toggle('invalid', bad);
    if (bad) ok = false;
  });
  if (!ok) { err.textContent = t('errReq'); return; }
  var data = collect();
  if (!data.items.length) {
    Array.prototype.forEach.call(rowsEl.querySelectorAll('.tsel'), function (s) { if (!s.value) s.classList.add('invalid'); });
    err.textContent = t('errRows');
    return;
  }
  var btn = document.getElementById('send');
  btn.disabled = true; btn.textContent = t('sending');
  function done() {
    document.getElementById('f').hidden = true;
    document.getElementById('thanks').hidden = false;
    window.scrollTo(0, 0);
  }
  function fail() {
    btn.disabled = false; btn.textContent = t('send');
    err.textContent = t('errSend');
  }
  fetch(ENDPOINT, {
    method: 'POST',
    credentials: 'omit',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(data)
  }).then(function (r) { return r.json(); })
    .then(function (j) { if (j && j.ok) done(); else fail(); })
    .catch(fail);
});

addRow();
setLang('he');
</script>
</body>
</html>
